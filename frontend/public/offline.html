<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Can't reach your t@sk4ce box</title>
<style>
  :root { --f-bg: #f4f7fa; --f-card: #fff; --f-ink: #1d2b53; --f-sub: #4a5a80; --f-line: #eef1f6; --f-sun: #ffc93c; --f-grid: rgba(29, 43, 83, 0.12); --f-shadow: 0 1px 2px rgba(29, 43, 83, 0.06), 0 6px 20px rgba(29, 43, 83, 0.08); }
  @media (prefers-color-scheme: dark) {
    :root { --f-bg: #1e2026; --f-card: #18213f; --f-ink: #e8eeff; --f-sub: #8f9cc4; --f-line: #232f57; --f-grid: rgba(255, 255, 255, 0.08); --f-shadow: 0 6px 20px rgba(0, 0, 0, 0.45); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--f-bg); color: var(--f-ink); font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(var(--f-grid) 1px, transparent 1px), linear-gradient(90deg, var(--f-grid) 1px, transparent 1px); background-size: 24px 24px; -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 10%, transparent 75%); mask-image: radial-gradient(ellipse at 50% 0%, #000 10%, transparent 75%); }
  main { position: relative; width: 100%; max-width: 420px; padding: 32px 28px; text-align: center; background: var(--f-card); border: 1px solid var(--f-line); border-radius: 16px; box-shadow: var(--f-shadow); }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { margin: 20px 0 8px; font-size: 24px; line-height: 1.2; font-family: 'Space Grotesk', system-ui, sans-serif; }
  p { margin: 0 0 24px; color: var(--f-sub); font-size: 16px; line-height: 1.5; }
  button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 8px; background: var(--f-sun); color: #1d2b53; font: inherit; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--f-ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="72" height="72">
  <h1>Can't reach your t@sk4ce box</h1>
  <p>Make sure this phone is on your home Wi-Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>

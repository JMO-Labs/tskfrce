# Dependency updates. Minor/patch bumps are grouped (one PR per ecosystem per week)
# because every PR runs the ~17 min lab job; .github/workflows/dependabot-automerge.yml
# auto-merges those groups once required checks pass. Majors get their own PR for review,
# except packages that must move together (grouped below across all update types).
# Security updates are unaffected: they open immediately and ungrouped (groups here
# only apply to version updates).
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      # Coupled packages: one PR even for majors (a lone @mantine/hooks major can't install).
      mantine: { patterns: ["@mantine/*"] }
      next: { patterns: ["next", "eslint-config-next", "@next/*"] }
      react: { patterns: ["react", "react-dom", "@types/react", "@types/react-dom"] }
      testing-library: { patterns: ["@testing-library/*"] }
      minor-patch: { update-types: [minor, patch] }
    ignore:
      # eslint-config-next 15.x peers eslint <=9 (v16 needs Next 16); eslint-plugin-react
      # (peer ^9.7), -import and -jsx-a11y also lack eslint 10. Revisit after Next 16 + plugins.
      - dependency-name: eslint
        versions: ["10.x"]
      # typescript-eslint 8.72 (pulled in by eslint-config-next) peers typescript <6.1.0;
      # TS 7 is the native compiler. Revisit once typescript-eslint and Next support 7.
      - dependency-name: typescript
        versions: ["7.x"]

  - package-ecosystem: pip
    directories: [/backend, /blocker]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/backend, /blocker, /frontend, /lab/host, /lab/router]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      # All action bumps (majors too) in one weekly PR; pins are SHAs, so review the diff.
      actions: { patterns: ["*"] }

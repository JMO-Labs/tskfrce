name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# One run per PR/branch: a new push to a PR cancels its stale run. main/tags never cancel.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'homelab' }}  # forks never touch the home runner
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.11'
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: |
        pip install -r backend/requirements.txt ruff
        cd frontend
        npm ci
    - name: Run linting
      run: |
        ruff format --check backend blocker && ruff check backend blocker
        cd frontend
        npm run lint
        npm run type-check

  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'homelab' }}  # forks never touch the home runner
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r backend/requirements.txt
    - name: Run test suite
      run: cd backend && python -m pytest tests -q

  installer:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'homelab' }}  # forks never touch the home runner
    needs: [lint, test]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Shellcheck
      run: shellcheck install.sh scripts/test-install.sh scripts/start.sh scripts/prep-box.sh
    - name: Installer smoke test
      run: bash scripts/test-install.sh

  lab:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'homelab' }}  # forks never touch the home runner
    needs: [lint, test]
    timeout-minutes: 40
    # One lab at a time repo-wide (heavy, ~17 min); others wait in order without holding a runner.
    concurrency:
      group: lab-${{ github.repository }}
      queue: max
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with: { python-version: '3.11' }
    - run: pip install pytest pyyaml
    - name: Enable IPv6 on Docker bridges
      # homelab runners: dind sidecar already runs with --ipv6 (homelab_k3s arc/values.yaml)
      if: runner.environment == 'github-hosted'
      run: |
        echo '{"ipv6": true, "fixed-cidr-v6": "fd00:d0c::/64"}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
    - name: Lab integration tests
      run: cd blocker && RUN_INTEGRATION=1 python -m pytest tests/lab -v
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with: { node-version: '18', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
    # the e2e container sits on the offline lab network; it uses these node_modules
    - run: cd frontend && npm ci
    - name: Browser e2e
      run: |
        bash scripts/lab.sh up
        bash scripts/lab.sh e2e
    - name: Upload e2e screenshots
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: e2e-artifacts
        path: frontend/e2e-artifacts
        if-no-files-found: ignore
    - name: Lab logs on failure
      if: failure()
      run: INTERNAL_TOKEN=labtoken docker compose -f lab/docker-compose.lab.yml --profile e2e logs --no-color  # e2e profile = frontend
    - name: Lab teardown
      if: always()
      run: bash scripts/lab.sh down

  security-scan:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'homelab' }}  # forks never touch the home runner
    needs: [test, lint]
    permissions:
      contents: read
      actions: read
      security-events: write  # upload-sarif; org default token is read-only

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@a3d1b77a1ba1550fbb5c74db1dc3a11f4a481126 # v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Upload Trivy report as artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: trivy-results
        path: trivy-results.sarif

  build-and-push:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'homelab' }}  # forks never touch the home runner
    needs: [test, lint, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        service: [backend, frontend, blocker]

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    # arm64 for Raspberry Pi; frontend compiles natively, python images use QEMU
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Log in to Container Registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image tags
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
        tags: |
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}

    - name: Build and push ${{ matrix.service }}
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: ./${{ matrix.service }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: homelab
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: |
        pip install -r backend/requirements.txt ruff
        cd frontend
        npm ci
    - name: Run linting
      run: |
        ruff format --check backend blocker && ruff check backend blocker
        cd frontend
        npm run lint
        npm run type-check

  test:
    runs-on: homelab
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r backend/requirements.txt
    - name: Run test suite
      run: cd backend && python -m pytest tests -q

  installer:
    runs-on: homelab
    needs: [lint, test]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Shellcheck
      run: shellcheck install.sh scripts/test-install.sh scripts/start.sh scripts/prep-box.sh
    - name: Installer smoke test
      run: bash scripts/test-install.sh

  lab:
    runs-on: homelab
    needs: [lint, test]
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with: { python-version: '3.11' }
    - run: pip install pytest pyyaml
    - name: Enable IPv6 on Docker bridges
      # homelab runners: dind sidecar already runs with --ipv6 (homelab_k3s arc/values.yaml)
      if: runner.environment == 'github-hosted'
      run: |
        echo '{"ipv6": true, "fixed-cidr-v6": "fd00:d0c::/64"}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
    - name: Lab integration tests
      run: cd blocker && RUN_INTEGRATION=1 python -m pytest tests/lab -v
    - uses: actions/setup-node@v4
      with: { node-version: '18', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
    # the e2e container sits on the offline lab network; it uses these node_modules
    - run: cd frontend && npm ci
    - name: Browser e2e
      run: |
        bash scripts/lab.sh up
        bash scripts/lab.sh e2e
    - name: Upload e2e screenshots
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-artifacts
        path: frontend/e2e-artifacts
        if-no-files-found: ignore
    - name: Lab logs on failure
      if: failure()
      run: INTERNAL_TOKEN=labtoken docker compose -f lab/docker-compose.lab.yml logs --no-color
    - name: Lab teardown
      if: always()
      run: bash scripts/lab.sh down

  security-scan:
    runs-on: homelab
    needs: [test, lint]
    permissions:
      contents: read
      actions: read
      security-events: write  # upload-sarif; org default token is read-only

    steps:
    - uses: actions/checkout@v7
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Upload Trivy report as artifact
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: trivy-results
        path: trivy-results.sarif

  build-and-push:
    runs-on: homelab
    needs: [test, lint, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        service: [backend, frontend, blocker]

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7

    # arm64 for Raspberry Pi; frontend compiles natively, python images use QEMU
    - uses: docker/setup-qemu-action@v4
    - uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
        tags: |
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
          type=semver,pattern={{version}}

    - name: Build and push ${{ matrix.service }}
      uses: docker/build-push-action@v6
      with:
        context: ./${{ matrix.service }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}

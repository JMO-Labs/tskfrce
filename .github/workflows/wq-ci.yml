name: wq-ci
on:
  pull_request:
    branches: [dev]
permissions: {contents: read, pull-requests: write}
jobs:
  wq:
    uses: JMO-Labs/wq-ci/.github/workflows/wq-ci.yml@v1
    with:
      test-cmd: >-
        pip install -q -r backend/requirements.txt pytest-cov
        && cd backend && python -m pytest tests -q --cov --cov-report=xml:../coverage.xml --junitxml=../junit.xml
      fix-cmd: pip install -q ruff && ruff format backend blocker examples && ruff check --fix backend blocker examples
    secrets: inherit

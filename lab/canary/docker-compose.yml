# Deploy on Beast. Needs .env with CANARY_SECRET. NO published ports: only cloudflared reaches these.
services:
  canary:
    build: .
    image: escape-canary:local
    container_name: escape-canary
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      CANARY_SECRET: ${CANARY_SECRET:?set in .env}
    networks: [proxy_net]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "7"}
  wstunnel:
    image: ghcr.io/erebe/wstunnel:latest
    container_name: escape-wstunnel
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/home/app/wstunnel"]
    command:
      - server
      - ws://0.0.0.0:8080
      - --restrict-to=canary:8080
      - --restrict-http-upgrade-path-prefix=${CANARY_SECRET:?set in .env}
    networks: [proxy_net]
    depends_on: [canary]
networks:
  proxy_net:
    external: true

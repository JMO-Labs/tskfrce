free_ip() { BX list | python3 -c "import sys,json; ip=sys.argv[1]; sys.exit(any(d['ip']==ip and d['online'] for d in json.load(sys.stdin)))" $1 &&
  ! $D run ping -c2 -W1 $1 >/dev/null 2>&1; }
mkdir -p $O; rm -f $O/$ID.log $O/$ID.done; date -u -d '-10 sec' +%Y-%m-%dT%H:%M:%S > $O/$ID.since; : > $O/$ID.macs
log "start id=$ID box_dev46=$(BX mine c4:8b:66:54:72:0d)" '''
host_locked_setup = '''O=/home/user/code/tskfrce/lab/devices/runs/identity-obs; ID=id.rotate.storm
A='sudo -n /usr/local/sbin/droidns run /home/user/Android/Sdk/platform-tools/adb'
D='sudo -n /usr/local/sbin/droidns'
BX() { ssh -o BatchMode=yes -i $HOME/.ssh/id_gen_key ubuntu@192.168.1.98 "docker exec -i task4ce-backend-1 python - $*" < /home/user/code/tskfrce/lab/devices/boxctl.py; }
log() { echo "$(date -u +%T) $*" >> $O/$ID.log; }
curmac() { $D status | awk '/^wlp3s0/{print $3; exit}'; }
# adbloop SECS: shots of real.sh for SECS; prints leaks=ok/tries first_ok last_ok (seconds from start)
adbloop() { s=$(date +%s); n=0; l=0; f=none; la=none; while [ $(( $(date +%s)-s )) -lt $1 ]; do n=$((n+1));
  if $A shell /data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl= >/dev/null 2>&1; then l=$((l+1)); t=$(( $(date +%s)-s )); [ $f = none ] && f=${t}s; la=${t}s; fi; sleep 1; done; echo "leaks=$l/$n first_ok=$f last_ok=$la"; }
# waitip: a fresh MAC's DHCPv4 lease can land well after droidns returns (observed ~40 s): poll up to 70 s
waitip() { ip=; for w in $(seq 35); do ip=$($D status | grep -o '10\.10\.40\.[0-9]*/24' | head -1); [ -n "$ip" ] && break; sleep 2; done; }
fail() { log "MOVE_FAILED: $*"; $A shell touch /data/local/tmp/id.invalid; }
# offline_ip IP: refuse unless the box lists no ONLINE device with that ip and it does not answer ping
free_ip() { BX list | python3 -c "import sys,json; ip=sys.argv[1]; sys.exit(any(d['ip']==ip and d['online'] for d in json.load(sys.stdin)))" $1 &&
  ! $D run ping -c2 -W1 $1 >/dev/null 2>&1; }
(
for i in 1 2 3 4 5; do
$D mac random Pixel-7 android-dhcp-15 > $O/$ID.rot 2>&1; m=$(curmac); echo $m >> $O/$ID.macs; waitip
log "rotated to $m random Pixel-7 android-dhcp-15 ip=$ip"; case $m in c4:8b:66:54:72:0d|"") fail "mac did not change";; esac; [ -n "$ip" ] || fail "no ip after rotate"
  r=$(adbloop 8); log "storm rot$i $m $r"; case $r in leaks=0/*) ;; *) $A shell touch /data/local/tmp/id.leaked;; esac
done; touch $O/$ID.done ) </dev/null >/dev/null 2>&1 &
log "storm started in background (5 rotations); runner probe runs concurrently"
'''

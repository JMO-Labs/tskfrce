# Identity-evasion rows: does a paused device stay paused when it changes its network identity?
# Rows run on the runner's normal flow (unlock -> baseline -> lock device 46 -> settle -> kid move -> probe).
# The kid move is a HOST hook (host_locked_setup) that calls droidns (mac/rejoin/static). Because the box sees a
# NEW device row after a MAC change, the runner's alert oracle (device 46 only) cannot see those events: every row's
# host_teardown dumps what the box did (new device rows, hint_of_id, events, parent notifications) to
# lab/devices/runs/identity-obs/<id>.json, restores the hw MAC, verifies internet is back and deletes lab-created
# private-MAC device rows (macs listed in .macs only). restore_probe is `true` because the device still wears the
# rotated MAC when the runner's restore check fires; the real restore check is in host_teardown (obs file, restore=).
# Probe semantics: unlocked baseline = one real.sh shot. Locked = loop for the window, print
# `leaks=<ok>/<tries> first_ok=<s> last_ok=<s>` (seconds since the kid move finished; last_ok = time-to-block),
# rc 0 (LEAK) if any shot reached the internet. Markers on the emulator: id.locked, id.invalid (move failed -> rc 2
# so the row cannot pass vacuously), id.leaked (an earlier storm rotation leaked).
# INVERTED rows (id.randmac.unpaused): the runner locks 46, the kid move unlocks it first; the probe exits 1 when
# internet works. BLOCKED there means "stayed online (pass)", LEAK means "lost connectivity (fail)".

[[scenario]]
optin = true
id = "id.randmac.paused"
title = "Paused phone rotates to a random private MAC with Android-like DHCP identity"
category = "identity"
platforms = ["A"]
timeout = 105
restore_probe = "true"
setup = '''rm -f /data/local/tmp/id.locked /data/local/tmp/id.invalid /data/local/tmp/id.leaked'''
locked_setup = '''touch /data/local/tmp/id.locked'''
probe = '''K=/data/local/tmp/kit; U=https://www.cloudflare.com/cdn-cgi/trace; M=/data/local/tmp
[ -f $M/id.locked ] || { $K/real.sh $U fl=; exit $?; }
[ -f $M/id.invalid ] && { echo INVALID_MOVE; exit 2; }
S=$(date +%s); N=0; L=0; F=none; LA=none
while [ $(( $(date +%s)-S )) -lt 75 ]; do N=$((N+1))
  if $K/real.sh $U fl=; then L=$((L+1)); T=$(( $(date +%s)-S )); [ $F = none ] && F=${T}s; LA=${T}s;  fi; sleep 1; done
[ -f $M/id.leaked ] && { echo "EARLIER_ROTATION_LEAKED $L/$N"; exit 0; }
echo "leaks=$L/$N first_ok=$F last_ok=$LA"
[ $L -gt 0 ] && exit 0; exit 1'''
host_setup = '''O=/home/user/code/tskfrce/lab/devices/runs/identity-obs; ID=id.randmac.paused
A='sudo -n /usr/local/sbin/droidns run /home/user/Android/Sdk/platform-tools/adb'
D='sudo -n /usr/local/sbin/droidns'
BX() { ssh -o BatchMode=yes -i $HOME/.ssh/id_gen_key ubuntu@192.168.1.98 "docker exec -i task4ce-backend-1 python - $*" < /home/user/code/tskfrce/lab/devices/boxctl.py; }
log() { echo "$(date -u +%T) $*" >> $O/$ID.log; }
curmac() { $D status | awk '/^wlp3s0/{print $3; exit}'; }
# adbloop SECS: shots of real.sh for SECS; prints leaks=ok/tries first_ok last_ok (seconds from start)
adbloop() { s=$(date +%s); n=0; l=0; f=none; la=none; while [ $(( $(date +%s)-s )) -lt $1 ]; do n=$((n+1));
  if $A shell /data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl= >/dev/null 2>&1; then l=$((l+1)); t=$(( $(date +%s)-s )); [ $f = none ] && f=${t}s; la=${t}s; fi; sleep 1; done; echo "leaks=$l/$n first_ok=$f last_ok=$la"; }
# waitip: a fresh MAC's DHCPv4 lease can land well after droidns returns (observed ~40 s): poll up to 70 s
waitip() { ip=; for w in $(seq 35); do ip=$($D status | grep -o '10\.10\.40\.[0-9]*/24' | head -1); [ -n "$ip" ] && break; sleep 2; done; }
fail() { log "MOVE_FAILED: $*"; $A shell touch /data/local/tmp/id.invalid; }
# offline_ip IP: refuse unless the box lists no ONLINE device with that ip and it does not answer ping
free_ip() { BX list | python3 -c "import sys,json; ip=sys.argv[1]; sys.exit(any(d['ip']==ip and d['online'] for d in json.load(sys.stdin)))" $1 &&
  ! $D run ping -c2 -W1 $1 >/dev/null 2>&1; }
mkdir -p $O; rm -f $O/$ID.log $O/$ID.done; date -u -d '-10 sec' +%Y-%m-%dT%H:%M:%S > $O/$ID.since; : > $O/$ID.macs
log "start id=$ID box_dev46=$(BX mine c4:8b:66:54:72:0d)" '''
host_locked_setup = '''O=/home/user/code/tskfrce/lab/devices/runs/identity-obs; ID=id.randmac.paused
A='sudo -n /usr/local/sbin/droidns run /home/user/Android/Sdk/platform-tools/adb'
D='sudo -n /usr/local/sbin/droidns'
BX() { ssh -o BatchMode=yes -i $HOME/.ssh/id_gen_key ubuntu@192.168.1.98 "docker exec -i task4ce-backend-1 python - $*" < /home/user/code/tskfrce/lab/devices/boxctl.py; }
log() { echo "$(date -u +%T) $*" >> $O/$ID.log; }
curmac() { $D status | awk '/^wlp3s0/{print $3; exit}'; }
# adbloop SECS: shots of real.sh for SECS; prints leaks=ok/tries first_ok last_ok (seconds from start)
adbloop() { s=$(date +%s); n=0; l=0; f=none; la=none; while [ $(( $(date +%s)-s )) -lt $1 ]; do n=$((n+1));
  if $A shell /data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl= >/dev/null 2>&1; then l=$((l+1)); t=$(( $(date +%s)-s )); [ $f = none ] && f=${t}s; la=${t}s; fi; sleep 1; done; echo "leaks=$l/$n first_ok=$f last_ok=$la"; }
# waitip: a fresh MAC's DHCPv4 lease can land well after droidns returns (observed ~40 s): poll up to 70 s
waitip() { ip=; for w in $(seq 35); do ip=$($D status | grep -o '10\.10\.40\.[0-9]*/24' | head -1); [ -n "$ip" ] && break; sleep 2; done; }
fail() { log "MOVE_FAILED: $*"; $A shell touch /data/local/tmp/id.invalid; }
# offline_ip IP: refuse unless the box lists no ONLINE device with that ip and it does not answer ping
free_ip() { BX list | python3 -c "import sys,json; ip=sys.argv[1]; sys.exit(any(d['ip']==ip and d['online'] for d in json.load(sys.stdin)))" $1 &&
  ! $D run ping -c2 -W1 $1 >/dev/null 2>&1; }
$D mac random Pixel-7 android-dhcp-15 > $O/$ID.rot 2>&1; m=$(curmac); echo $m >> $O/$ID.macs; waitip
log "rotated to $m random Pixel-7 android-dhcp-15 ip=$ip"; case $m in c4:8b:66:54:72:0d|"") fail "mac did not change";; esac; [ -n "$ip" ] || fail "no ip after rotate"
'''
host_teardown = '''O=/home/user/code/tskfrce/lab/devices/runs/identity-obs; ID=id.randmac.paused
A='sudo -n /usr/local/sbin/droidns run /home/user/Android/Sdk/platform-tools/adb'
D='sudo -n /usr/local/sbin/droidns'
BX() { ssh -o BatchMode=yes -i $HOME/.ssh/id_gen_key ubuntu@192.168.1.98 "docker exec -i task4ce-backend-1 python - $*" < /home/user/code/tskfrce/lab/devices/boxctl.py; }
log() { echo "$(date -u +%T) $*" >> $O/$ID.log; }
curmac() { $D status | awk '/^wlp3s0/{print $3; exit}'; }
# adbloop SECS: shots of real.sh for SECS; prints leaks=ok/tries first_ok last_ok (seconds from start)
adbloop() { s=$(date +%s); n=0; l=0; f=none; la=none; while [ $(( $(date +%s)-s )) -lt $1 ]; do n=$((n+1));
  if $A shell /data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl= >/dev/null 2>&1; then l=$((l+1)); t=$(( $(date +%s)-s )); [ $f = none ] && f=${t}s; la=${t}s; fi; sleep 1; done; echo "leaks=$l/$n first_ok=$f last_ok=$la"; }
# waitip: a fresh MAC's DHCPv4 lease can land well after droidns returns (observed ~40 s): poll up to 70 s
waitip() { ip=; for w in $(seq 35); do ip=$($D status | grep -o '10\.10\.40\.[0-9]*/24' | head -1); [ -n "$ip" ] && break; sleep 2; done; }
fail() { log "MOVE_FAILED: $*"; $A shell touch /data/local/tmp/id.invalid; }
# offline_ip IP: refuse unless the box lists no ONLINE device with that ip and it does not answer ping
free_ip() { BX list | python3 -c "import sys,json; ip=sys.argv[1]; sys.exit(any(d['ip']==ip and d['online'] for d in json.load(sys.stdin)))" $1 &&
  ! $D run ping -c2 -W1 $1 >/dev/null 2>&1; }
for i in $(seq 30); do [ -f $O/$ID.done ] || [ $ID != id.rotate.storm ] && break; sleep 2; done
since=$(cat $O/$ID.since); log "teardown cur_mac=$(curmac)"
BX since $since > $O/$ID.json 2>>$O/$ID.log; log "wrote $ID.json"
for m in $(cat $O/$ID.macs); do log "delete $m: $(BX delete $m 2>&1 | tail -1)"; done
$D mac hw >/dev/null 2>&1; log "hw restored mac=$(curmac)"
r=FAIL; for i in 1 2 3 4 5 6; do $A shell /data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl= && { r=ok; break; }; sleep 3; done
log "restore=$r"; echo "restore=$r" >> $O/$ID.log'''


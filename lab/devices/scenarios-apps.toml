# Real kid apps (installed by apps-kit.sh). Oracle: app-probe.sh = per-UID rx bytes after launch + scroll.
# rc 0 = >300 KB real content, 3 = 20-300 KB, 1 = less. Screenshot of the final screen: /sdcard/escape-<pkg>.png.

[[scenario]]
skip = "uncalibrated: app-probe thresholds + first-run dialogs pending (see README Apps)"
id = "app.youtube"
title = "YouTube app: launch, scroll, count bytes received"
category = "apps"
platforms = ["A"]
probe = '''/data/local/tmp/kit/app-probe.sh com.google.android.youtube 40'''
timeout = 100


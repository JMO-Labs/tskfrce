# Real kid apps (installed by apps-kit.sh). Oracle: app-probe.sh = per-UID rx bytes after launch + scroll.
# rc 0 = > MIN (3rd arg, default 300 KB; ~half the app's unpaused payload when logged out), 3 = 20 KB..MIN, 1 = less.
# Unpaused calibration 2026-11-15 (40 s, no accounts): Roblox 51 MB, TikTok 15 MB, Discord 13 MB, ChatGPT 9.5 MB,
# Snapchat 3.4 MB, Twitch 3 MB, Pinterest 645 KB, Netflix 409 KB, Instagram 302 KB, Reddit/WhatsApp/char.ai/Telegram
# ~230 KB, Spotify 190 KB, YouTube Kids 121 KB (parent gate), YouTube 11 MB via a video link.
# Those are FIRST launches; later launches use cached assets: Discord 27-35 KB, Snapchat 43 KB, Instagram 120 KB,
# WhatsApp 35 KB, char.ai 100 KB, ChatGPT 55-61 KB, Telegram 2-4 KB. MIN uses the cached figure. Paused noise: -4..+0.1 KB. Screenshot of the final screen: /sdcard/escape-<pkg>.png.

[[scenario]]
id = "app.youtube"
title = "YouTube app: launch, scroll, count bytes received"
category = "apps"
platforms = ["A"]
probe = '''/data/local/tmp/kit/app-probe.sh com.google.android.youtube 40 300000 'https://www.youtube.com/watch?v=jNQXAC9IVRw''''
timeout = 100


# Escape matrix rows for platform A that need no server. Shell runs as root via adb shell.
# Probe rc: 0 = real internet reached, 1 = blocked, 3 = partial. See escape.py.

[[scenario]]
id = "tx.https"
title = "Plain HTTPS to a CDN (TLS validated, body checked)"
category = "transport"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl='''

[[scenario]]
id = "tx.http"
title = "Plain HTTP (portal/gate answers must not match)"
category = "transport"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh http://example.com 'Example Domain''''

[[scenario]]
id = "tx.quic"
title = "HTTP/3 over UDP 443"
category = "transport"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh https://cloudflare-quic.com cloudflare --http3-only'''

[[scenario]]
id = "tx.iplit"

# Escape matrix rows for platform A that need no server. Shell runs as root via adb shell.
# Probe rc: 0 = real internet reached, 1 = blocked, 3 = partial. See escape.py.

[[scenario]]
id = "tx.https"
title = "Plain HTTPS to a CDN (TLS validated, body checked)"
category = "transport"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl='''

[[scenario]]
id = "tx.http"
title = "Plain HTTP (portal/gate answers must not match)"
category = "transport"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh http://example.com 'Example Domain''''

[[scenario]]
id = "tx.quic"
title = "HTTP/3 over UDP 443"
category = "transport"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh https://cloudflare-quic.com cloudflare --http3-only'''

[[scenario]]
id = "tx.iplit"
title = "HTTPS to a bare IP"
category = "transport"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh https://1.1.1.1/cdn-cgi/trace fl='''

[[scenario]]
id = "tx.ech"
title = "Encrypted Client Hello via DoH-fetched config"
category = "transport"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh https://crypto.cloudflare.com/cdn-cgi/trace sni=encrypted --ech true --doh-url https://1.1.1.1/dns-query'''

[[scenario]]
id = "tx.longlived"
title = "Stream opened before the lock keeps flowing"
category = "transport"
platforms = ["A"]
setup = '''/data/local/tmp/kit/longlived.sh start'''
teardown = '''/data/local/tmp/kit/longlived.sh stop'''
restore_probe = '''/data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl='''
probe = '''/data/local/tmp/kit/longlived.sh check'''
timeout = 30

[[scenario]]
id = "dns.static.8888"
title = "Plain DNS to 8.8.8.8:53"
category = "dns"
platforms = ["A"]
probe = '''! /data/local/tmp/kit/q example.com A @192.0.2.53 --timeout 3s | grep -q ' A [0-9]' && SSL_CERT_FILE=/data/local/tmp/kit/ca-bundle.crt /data/local/tmp/kit/q example.com A @8.8.8.8 --timeout 5s | grep -q ' A [0-9]''''

[[scenario]]
id = "dns.static.1111"
title = "Plain DNS to 1.1.1.1:53"
category = "dns"
platforms = ["A"]
probe = '''! /data/local/tmp/kit/q example.com A @192.0.2.53 --timeout 3s | grep -q ' A [0-9]' && SSL_CERT_FILE=/data/local/tmp/kit/ca-bundle.crt /data/local/tmp/kit/q example.com A @1.1.1.1 --timeout 5s | grep -q ' A [0-9]''''

[[scenario]]
id = "dns.static.9999"
title = "Plain DNS to 9.9.9.9:53"
category = "dns"
platforms = ["A"]
probe = '''! /data/local/tmp/kit/q example.com A @192.0.2.53 --timeout 3s | grep -q ' A [0-9]' && SSL_CERT_FILE=/data/local/tmp/kit/ca-bundle.crt /data/local/tmp/kit/q example.com A @9.9.9.9 --timeout 5s | grep -q ' A [0-9]''''

[[scenario]]
id = "dns.dot.direct"
title = "DoT to 8.8.8.8:853"
category = "dns"
platforms = ["A"]
probe = '''SSL_CERT_FILE=/data/local/tmp/kit/ca-bundle.crt /data/local/tmp/kit/q example.com A @tls://8.8.8.8 --timeout 5s | grep -q ' A [0-9]''''

[[scenario]]
id = "dns.dot.private"
title = "Android Private DNS hostname=dns.google"
category = "dns"
platforms = ["A"]
setup = '''settings put global private_dns_mode hostname; settings put global private_dns_specifier dns.google; sleep 6'''
locked_setup = '''settings put global private_dns_mode opportunistic; sleep 2; settings put global private_dns_mode hostname; sleep 10'''
expect_alert = true
teardown = '''settings put global private_dns_mode opportunistic'''
probe = '''ping -c1 -W3 r$(date +%s%N).1-1-1-1.sslip.io 2>&1 | grep -q '(1.1.1.1)''''

[[scenario]]
id = "dns.doh.iplit"
title = "DoH to an IP literal (1.1.1.1)"
category = "dns"
platforms = ["A"]
probe = '''SSL_CERT_FILE=/data/local/tmp/kit/ca-bundle.crt /data/local/tmp/kit/q example.com A @https://1.1.1.1/dns-query --timeout 5s | grep -q ' A [0-9]''''

[[scenario]]
id = "dns.doh.google"

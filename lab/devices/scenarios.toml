[[scenario]]
id = "dns.dot.private"
title = "Android Private DNS hostname=dns.google"
category = "dns"
platforms = ["A"]
setup = '''settings put global private_dns_mode hostname; settings put global private_dns_specifier dns.google; sleep 6'''
locked_setup = '''settings put global private_dns_mode opportunistic; sleep 2; settings put global private_dns_mode hostname; sleep 10'''
alerts_expected = ["workaround_try"]
teardown = '''settings put global private_dns_mode opportunistic'''
probe = '''ping -c1 -W3 r$(date +%s%N).1-1-1-1.sslip.io 2>&1 | grep -q '(1.1.1.1)''''


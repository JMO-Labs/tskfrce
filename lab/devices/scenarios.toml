[[scenario]]
id = "id.forget"
title = "Wi-Fi off/on while locked, then try to reach the internet"
category = "identity"
platforms = ["A"]
probe = '''svc wifi disable; sleep 2; svc wifi enable; i=0; while [ $i -lt 8 ]; do /data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl= && exit 0; sleep 3; i=$((i+1)); done; exit 1'''
timeout = 140


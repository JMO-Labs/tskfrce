[[scenario]]
id = "dns.doq"
title = "DNS over QUIC (UDP 853) to AdGuard IP"
category = "dns"
platforms = ["A"]
probe = '''SSL_CERT_FILE=/data/local/tmp/kit/ca-bundle.crt /data/local/tmp/kit/q example.com A @quic://94.140.14.14 --timeout 5s | grep -q ' A [0-9]''''

[[scenario]]
id = "dns.hosts"
title = "Hosts-style pinning: connect straight to a CDN IP"
category = "dns"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl= --connect-to ::104.16.124.96:'''

[[scenario]]
id = "gate.budget"
title = "20 parallel connections to Google search; real results count"

category = "transport"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh https://1.1.1.1/cdn-cgi/trace fl='''

[[scenario]]
id = "tx.ech"
title = "Encrypted Client Hello via DoH-fetched config"
category = "transport"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh https://crypto.cloudflare.com/cdn-cgi/trace sni=encrypted --ech true --doh-url https://1.1.1.1/dns-query'''

[[scenario]]
id = "tx.longlived"
title = "Stream opened before the lock keeps flowing"
category = "transport"
platforms = ["A"]
setup = '''/data/local/tmp/kit/longlived.sh start'''
teardown = '''/data/local/tmp/kit/longlived.sh stop'''
restore_probe = '''/data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl='''
probe = '''/data/local/tmp/kit/longlived.sh check'''
timeout = 30


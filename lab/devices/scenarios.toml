[[scenario]]
id = "proxy.translate"
title = "Google Translate (translate.goog) as a proxy"
category = "proxy"
platforms = ["A"]
probe = '''/data/local/tmp/kit/real.sh 'https://example-com.translate.goog/?_x_tr_sl=en&_x_tr_tl=fr' Example'''

[[scenario]]
id = "id.forget"
title = "Wi-Fi off/on while locked, then try to reach the internet"
category = "identity"
platforms = ["A"]
probe = '''svc wifi disable; sleep 2; svc wifi enable; i=0; while [ $i -lt 15 ]; do /data/local/tmp/kit/real.sh https://www.cloudflare.com/cdn-cgi/trace fl= && exit 0; sleep 3; i=$((i+1)); done; exit 1'''
timeout = 90


# Escape rows that need our locked-down canary (canary.jmolabs.dev, wstunnel at tunnel.jmolabs.dev).
# Probe rc 0 only on the exact reply canary:<fresh token>. Needs the kit with canary.secret (android-kit.sh).

[[scenario]]
id = "canary.https"
title = "Own canary over HTTPS (Cloudflare, direct)"
category = "canary"
platforms = ["A"]
probe = '''/data/local/tmp/kit/canary.sh hit https c$(date +%s%N)'''
timeout = 20

[[scenario]]
id = "canary.h3"
title = "Own canary over HTTP/3 (UDP 443)"
category = "canary"
platforms = ["A"]
probe = '''/data/local/tmp/kit/canary.sh hit h3 c$(date +%s%N)'''
timeout = 20

[[scenario]]
id = "canary.ws"
title = "WebSocket tunnel over Cloudflare to the canary (the free-VPN pattern)"
category = "canary"
platforms = ["A"]
probe = '''/data/local/tmp/kit/canary.sh hit ws c$(date +%s%N)'''
timeout = 75

